<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>phototag 画廊</title>
<style>
  :root{
    --bg:#111214; --bg2:#1a1c1f; --bg3:#232529; --fg:#e8e8ea; --fg2:#9a9aa0; --line:#2e3136;
    --sooc:#30d158; --edit:#0a84ff; --trash:#ff453a; --best:#ffd60a; --normal:#98989d;
    --scenery:#64d2ff; --animal:#ff9f0a; --portrait:#bf5af2; --insect:#a0d911; --food:#ff6482; --acc:#0a84ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font:14px/1.5 -apple-system,"PingFang SC","Helvetica Neue",sans-serif}
  button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
  button:hover{border-color:#4a4e55}
  input{font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:6px;color:var(--fg);padding:4px 9px}
  .primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
  /* ---- 顶栏 ---- */
  #top{position:sticky;top:0;z-index:10;background:rgba(20,21,24,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
  #row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  #root-name{font-weight:700;font-size:16px}
  #count{color:var(--fg2)}
  .ptnav{display:flex;gap:2px;background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:2px}
  .ptnav a{padding:3px 12px;border-radius:6px;color:var(--fg2);font-weight:600;text-decoration:none}
  .ptnav a:hover{color:var(--fg)}
  .ptnav a.cur{background:var(--acc);color:#fff}
  #row1 .sp{flex:1}
  #row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .fgroup{display:flex;align-items:center;gap:5px}
  .fgroup .gl{color:var(--fg2);margin-right:1px}
  .fchip{border:1px solid var(--line);border-radius:99px;padding:1px 11px;cursor:pointer;color:var(--fg2);user-select:none;white-space:nowrap}
  .fchip small{opacity:.75;margin-left:3px;font-variant-numeric:tabular-nums}
  .fchip.on{color:#000;font-weight:600;border-color:transparent}
  #search{width:170px}
  .dr{color:var(--fg2)}
  /* ---- 时间线 ---- */
  #tl{padding:8px 16px 80px}
  .sec h2{font-size:15px;margin:18px 0 8px;display:flex;align-items:baseline;gap:10px}
  .sec h2 small{color:var(--fg2);font-weight:400}
  .sec h2 a{color:var(--acc);font-size:12px;text-decoration:none;font-weight:400}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px}
  .it{position:relative;aspect-ratio:3/2;background:#1b1d20;border-radius:6px;overflow:hidden;cursor:pointer}
  .it img{width:100%;height:100%;object-fit:cover;display:block}
  .it .dot{position:absolute;left:6px;bottom:6px;width:10px;height:10px;border-radius:50%;box-shadow:0 0 4px #000}
  .it .star{position:absolute;right:6px;top:3px;color:var(--best);font-size:15px;text-shadow:0 0 4px #000}
  .it .ty{position:absolute;left:6px;top:5px;font-size:11px;padding:0 7px;border-radius:99px;color:#000;font-weight:600}
  .it:hover::after{content:attr(data-name);position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);font-size:11px;padding:1px 6px;color:#ddd}
  #empty{color:var(--fg2);text-align:center;padding:60px 0}
  /* ---- 灯箱 ---- */
  #lb{position:fixed;inset:0;background:rgba(5,5,6,.97);z-index:40;display:flex;flex-direction:column}
  #lb.hidden{display:none}
  #lb-stage{flex:1;position:relative;overflow:hidden;display:flex}
  #lb-img{max-width:100%;max-height:100%;margin:auto;user-select:none;-webkit-user-drag:none}
  #lb-img.zoomed{position:absolute;left:0;top:0;max-width:none;max-height:none;margin:0;cursor:grab}
  #lb-zoom{position:absolute;right:14px;top:12px;background:rgba(0,0,0,.6);padding:2px 10px;border-radius:99px;display:none;z-index:2}
  #lb-bar{display:flex;align-items:center;gap:14px;padding:8px 16px;background:var(--bg2);border-top:1px solid var(--line)}
  #lb-name{font-weight:600}
  #lb-pos,#lb-day{color:var(--fg2)}
  #lb-chips{display:flex;gap:6px}
  .chip{padding:1px 10px;border-radius:99px;font-weight:600;color:#000;font-size:13px}
  #lb-bar .sp{flex:1}
  #lb-hint{color:var(--fg2);font-size:12px}
  /* ---- 导出弹窗 ---- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:60}
  .modal.hidden{display:none}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;width:560px;max-width:92vw;max-height:82vh;display:flex;flex-direction:column;padding:16px;gap:10px}
  #brow-list{flex:1;overflow-y:auto;border:1px solid var(--line);border-radius:8px;min-height:180px;max-height:40vh}
  .brow-item{display:flex;justify-content:space-between;padding:6px 12px;cursor:pointer;border-bottom:1px solid #222428}
  .brow-item:hover{background:var(--bg3)}
  .brow-item .c{color:var(--fg2)}
  #ex-bar{height:8px;background:#2a2d31;border-radius:4px;overflow:hidden}
  #ex-bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
  #ex-log{color:var(--fg2);font-size:12px;max-height:120px;overflow-y:auto;white-space:pre-wrap}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:rgba(20,20,22,.94);border:1px solid var(--line);padding:6px 16px;border-radius:99px;opacity:0;transition:opacity .18s;pointer-events:none;z-index:99;white-space:nowrap}
  /* ---- 选择 ---- */
  .it .selbox{position:absolute;right:5px;bottom:5px;width:22px;height:22px;border-radius:6px;border:2px solid rgba(255,255,255,.85);background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:3;cursor:pointer}
  .it:hover .selbox{display:flex}
  .it.sel .selbox{display:flex;background:var(--acc);border-color:var(--acc)}
  .it .selbox .tick{color:#fff;font-size:13px;line-height:1;opacity:0}
  .it.sel .selbox .tick{opacity:1}
  .it.sel{outline:3px solid var(--acc);outline-offset:-3px}
  .sec h2 .selday{color:var(--acc);font-size:12px;cursor:pointer;font-weight:400}
  #seltools{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(28,30,34,.97);border:1px solid var(--line);border-radius:12px;padding:8px 14px;display:flex;gap:8px;align-items:center;z-index:45;box-shadow:0 8px 28px rgba(0,0,0,.55)}
  #seltools.hidden{display:none}
  #seltools b{color:var(--acc)}
  /* ---- 幻灯片 ---- */
  #ss{position:fixed;inset:0;background:#000;z-index:80;display:flex;flex-direction:column;--fade:300ms}
  #ss.hidden{display:none}
  #ss-stage{flex:1;position:relative;overflow:hidden;opacity:1}
  #ss-row{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  #ss-row img{display:block;object-fit:contain}
  #ss-row.fill img{object-fit:cover}
  #ss-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:15px;z-index:4}
  #ss-load.hidden{display:none}
  #ss-ctrl{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(20,20,22,.82);border:1px solid var(--line);border-radius:99px;padding:7px 18px;z-index:5;transition:opacity .3s;font-size:13px}
  #ss-ctrl.hidden{opacity:0;pointer-events:none}
  #ss-hint{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);color:#bbb;background:rgba(20,20,22,.72);border:1px solid var(--line);padding:6px 16px;border-radius:99px;font-size:13px;z-index:4;transition:opacity .5s}
  #ss-hint b{color:#fff}
  #ss-hint.hidden{opacity:0;pointer-events:none}
  #ss-ctrl button{background:transparent;border:none;padding:2px 6px;font-size:17px;line-height:1}
  #ss-ctrl .seg{display:flex;gap:1px;background:var(--bg3);border-radius:7px;padding:2px}
  #ss-ctrl .seg button{border-radius:5px;font-size:12px;padding:2px 9px;color:var(--fg2)}
  #ss-ctrl .seg button.on{background:var(--acc);color:#fff}
  #ss-ctrl .lbl{color:var(--fg2);font-variant-numeric:tabular-nums;min-width:52px;text-align:center}
</style>
</head>
<body>
<header id="top">
  <div id="row1">
    <span id="root-name">—</span>
    <button id="btn-root">📁 换目录</button>
    <span id="count"></span>
    <span class="sp"></span>
    <input id="search" placeholder="文件名搜索…">
    <button id="btn-play">▶ 幻灯片</button>
    <button id="btn-export" class="primary">导出当前筛选…</button>
    <nav class="ptnav" id="ptnav"><a data-base="/tagger" href="/tagger">打标</a><a class="cur" data-base="/gallery">画廊</a><a data-base="/tools" href="/tools">工具</a></nav>
  </div>
  <div id="row2"></div>
</header>
<div id="tl"></div>
<div id="empty" style="display:none">没有匹配的照片</div>

<div id="lb" class="hidden">
  <div id="lb-stage"><img id="lb-img" alt=""><div id="lb-zoom">100%</div></div>
  <div id="lb-bar">
    <span id="lb-name"></span><span id="lb-pos"></span><span id="lb-day"></span>
    <div id="lb-chips"></div>
    <span class="sp"></span>
    <span id="lb-hint">A/S/D Q/W/E/R Z/X 改tag · U撤销 · .或滚轮/捏合放大 · Esc关闭</span>
    <button id="lb-open-tagger">去打标器 ↗</button>
  </div>
</div>

<div id="modal-root" class="modal hidden"><div class="card">
  <h3>选择照片根目录</h3>
  <div style="display:flex;gap:8px"><input id="brow-input" style="flex:1" spellcheck="false"><button id="brow-go">跳转</button></div>
  <div id="brow-roots" style="display:flex;gap:6px;flex-wrap:wrap"></div>
  <div id="brow-list"></div>
  <div style="display:flex;justify-content:space-between;align-items:center">
    <span id="brow-cur" style="color:var(--fg2);font-size:12px;max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
    <div style="display:flex;gap:8px"><button onclick="closeModals()">取消</button><button id="brow-use" class="primary">✓ 就用这个目录</button></div>
  </div>
</div></div>

<div id="modal-export" class="modal hidden"><div class="card">
  <h3>导出当前筛选结果</h3>
  <div id="ex-summary" style="color:var(--fg2)"></div>
  <div style="display:flex;gap:8px;align-items:center">
    <span>目标目录</span><input id="ex-dest" style="flex:1" spellcheck="false">
  </div>
  <div style="color:var(--fg2);font-size:12px">按天建子文件夹复制;同名同大小的文件跳过;tag 会写入目标目录的 phototags.json。</div>
  <div id="ex-bar" style="display:none"><i></i></div>
  <div id="ex-log"></div>
  <div style="display:flex;justify-content:flex-end;gap:8px">
    <button onclick="closeModals()">关闭</button>
    <button id="ex-start" class="primary">开始导出</button>
  </div>
</div></div>
<div id="seltools" class="hidden">
  已选 <b id="sel-n">0</b> 张
  <button id="st-play" class="primary">▶ 播放选中</button>
  <button id="st-export">导出选中…</button>
  <button id="st-all">全选</button>
  <button id="st-clear">清除</button>
</div>

<div id="ss" class="hidden">
  <div id="ss-stage"><div id="ss-row"></div></div>
  <div id="ss-load" class="hidden">准备中…</div>
  <div id="ss-hint" class="hidden">按 <b>Esc</b> 显示控制栏 · 空格暂停 · ←/→ 切换 · 再按 Esc 退出</div>
  <div id="ss-ctrl" class="hidden">
    <button id="ss-prev" title="上一张 ←">⏮</button>
    <button id="ss-play" title="暂停/播放 空格">⏸</button>
    <button id="ss-next" title="下一张 →">⏭</button>
    <span class="lbl" id="ss-pos"></span>
    <span class="seg" id="ss-shuf">
      <button data-s="none" class="on">顺序</button>
      <button data-s="small">按日乱</button>
      <button data-s="big">全乱</button>
    </span>
    <span class="seg" id="ss-fit">
      <button data-f="0" class="on">适应</button>
      <button data-f="1">铺满</button>
    </span>
    <span class="seg" id="ss-speed">
      <button data-d="2000">2s</button>
      <button data-d="4000">4s</button>
      <button data-d="6000">6s</button>
      <button data-d="8000" class="on">8s</button>
    </span>
    <button id="ss-lock" title="锁定并回全屏">🔒</button>
    <button id="ss-exit" title="退出">✕</button>
  </div>
</div>

<div id="toast"></div>

<script>
"use strict";
const DIMS = {
  status:  {label:"状态", order:["sooc","edit","trash"], keys:{KeyA:"sooc",KeyS:"edit",KeyD:"trash"},
            zh:{sooc:"直出",edit:"大修",trash:"废片"}, color:{sooc:"var(--sooc)",edit:"var(--edit)",trash:"var(--trash)"}},
  type:    {label:"类型", order:["scenery","animal","portrait","insect","food"], keys:{KeyQ:"scenery",KeyW:"animal",KeyE:"portrait",KeyR:"insect",KeyT:"food"},
            zh:{scenery:"风景",animal:"动物",portrait:"人像",insect:"昆虫",food:"美食"}, color:{scenery:"var(--scenery)",animal:"var(--animal)",portrait:"var(--portrait)",insect:"var(--insect)",food:"var(--food)"}},
  quality: {label:"质量", order:["best","normal"], keys:{KeyZ:"best",KeyX:"normal"},
            zh:{best:"绝美",normal:"普通"}, color:{best:"var(--best)",normal:"var(--normal)"}},
};
const KEY2TAG = {};
for (const [dim, d] of Object.entries(DIMS))
  for (const [code, val] of Object.entries(d.keys)) KEY2TAG[code] = {dim, val};

const state = {
  root: null, home: "", days: [],          // day: {path,name,date,count,photos:[],tags:{}}
  filt: {status:new Set(), type:new Set(), quality:new Set(), q:"", days:0},
  flat: [],                                 // 当前筛选后的 [{day, p}]
  lb: -1, undoStack: [], redoStack: [],
  prewarmed: new Set(),
  sel: new Set(),                           // 选中的照片 key(day.path+"/"+name)
};
const $ = id => document.getElementById(id);
const enc = encodeURIComponent;
const escAttr = s => String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} :
    {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)});
  if (!r.ok) { let m = "HTTP " + r.status; try { m = (await r.json()).error || m; } catch (e) {} throw new Error(m); }
  return r.json();
}
let toastTimer = null;
function toast(msg, ms) {
  const t = $("toast"); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, ms || 1500);
}

/* ---------- 加载 ---------- */
async function setRoot(path) {
  try {
    const r = await api("/api/scan?root=" + enc(path));
    state.root = r.root;
    localStorage.setItem("ptg:root", r.root);
    $("root-name").textContent = r.root.split("/").pop() || r.root;
    $("root-name").title = r.root;
    wireNav();
    const days = r.days.slice().sort((a, b) => (b.date || "").localeCompare(a.date || "") || b.name.localeCompare(a.name));
    await Promise.all(days.map(async d => {
      try { const x = await api("/api/photos?dir=" + enc(d.path)); d.photos = x.photos; d.tags = x.tags || {}; }
      catch (e) { d.photos = []; d.tags = {}; d.err = e.message; }
    }));
    state.days = days;
    state.prewarmed.clear();
    render();
  } catch (e) { toast("⚠️ 扫描失败:" + e.message, 3000); }
}

/* ---------- 筛选 ---------- */
function matchDims(t, skipDim) {
  for (const dim of Object.keys(DIMS)) {
    if (dim === skipDim) continue;
    const set = state.filt[dim];
    if (set.size && !set.has((t && t[dim]) || "none")) return false;
  }
  return true;
}
function matchPhoto(day, p) {
  const t = day.tags[p.name];
  if (!matchDims(t)) return false;
  if (state.filt.q && !p.name.toLowerCase().includes(state.filt.q)) return false;
  return true;
}
function dayVisible(day) {
  if (!state.filt.days) return true;
  if (!day.date) return false;
  const lim = new Date(Date.now() - state.filt.days * 864e5).toISOString().slice(0, 10);
  return day.date >= lim;
}
function facetCounts(dim) {
  const c = {none: 0};
  for (const v of DIMS[dim].order) c[v] = 0;
  for (const day of state.days) {
    if (!dayVisible(day)) continue;
    for (const p of day.photos) {
      const t = day.tags[p.name];
      if (!matchDims(t, dim)) continue;
      if (state.filt.q && !p.name.toLowerCase().includes(state.filt.q)) continue;
      c[(t && t[dim]) || "none"]++;
    }
  }
  return c;
}

/* ---------- 渲染 ---------- */
function renderFilters() {
  const rows = [];
  for (const [dim, d] of Object.entries(DIMS)) {
    const cnt = facetCounts(dim);
    const chips = [...d.order, "none"].map(v => {
      const on = state.filt[dim].has(v);
      const color = v === "none" ? "var(--fg2)" : d.color[v];
      const label = v === "none" ? "未定" : d.zh[v];
      return `<span class="fchip${on ? " on" : ""}" style="${on ? "background:" + color : ""}"
        onclick="toggleFilt('${dim}','${v}')">${label}<small>${cnt[v]}</small></span>`;
    }).join("");
    rows.push(`<span class="fgroup"><span class="gl">${d.label}</span>${chips}</span>`);
  }
  const dr = [[0, "全部"], [7, "近7天"], [30, "近30天"], [90, "近90天"]].map(([n, l]) =>
    `<span class="fchip${state.filt.days === n ? " on" : ""}" style="${state.filt.days === n ? "background:var(--acc);color:#fff" : ""}"
      onclick="setDays(${n})">${l}</span>`).join("");
  rows.push(`<span class="fgroup"><span class="gl">时间</span>${dr}</span>`);
  const any = state.filt.status.size || state.filt.type.size || state.filt.quality.size || state.filt.q || state.filt.days;
  if (any) rows.push(`<span class="fchip" onclick="clearFilt()">✕ 清除筛选</span>`);
  $("row2").innerHTML = rows.join("");
}
function itemHTML(day, p, idx) {
  const t = day.tags[p.name] || {};
  const dot = t.status ? `<i class="dot" style="background:${DIMS.status.color[t.status]}"></i>` : "";
  const star = t.quality === "best" ? `<i class="star">★</i>` : "";
  const ty = t.type ? `<i class="ty" style="background:${DIMS.type.color[t.type]}">${DIMS.type.zh[t.type]}</i>` : "";
  const key = day.path + "/" + p.name;
  const sel = state.sel.has(key) ? " sel" : "";
  return `<div class="it${sel}" data-name="${p.name}" data-key="${escAttr(key)}" onclick="tileClick(${idx},event)">
    <img loading="lazy" src="/thumb?path=${enc(key)}&w=480">${dot}${star}${ty}
    <div class="selbox" onclick="toggleSel(${idx},event)"><span class="tick">✓</span></div></div>`;
}
function render() {
  renderFilters();
  state.flat = [];
  const secs = [];
  let total = 0;
  for (const day of state.days) {
    total += day.photos.length;
    if (!dayVisible(day)) continue;
    const items = [];
    for (const p of day.photos) {
      if (!matchPhoto(day, p)) continue;
      items.push(itemHTML(day, p, state.flat.length));
      state.flat.push({day, p});
    }
    if (!items.length) continue;
    secs.push(`<section class="sec" data-day="${day.path}">
      <h2>${day.date || day.name} <small>${day.name} · ${items.length}${items.length !== day.photos.length ? " / " + day.photos.length : ""} 张</small>
      <a href="/tagger?root=${enc(state.root)}&dir=${enc(day.path)}" target="_blank">去打标 ↗</a>
      <span class="selday" onclick="selectDay('${day.path.replace(/'/g, "\\'")}')">全选本天</span></h2>
      <div class="grid">${items.join("")}</div></section>`);
  }
  $("tl").innerHTML = secs.join("");
  $("empty").style.display = state.flat.length ? "none" : "";
  $("count").textContent = "匹配 " + state.flat.length + " / 共 " + total + " 张";
  observeSections();
}
const io = new IntersectionObserver(es => {
  for (const e of es) {
    if (!e.isIntersecting) continue;
    const path = e.target.dataset.day;
    if (state.prewarmed.has(path)) continue;
    state.prewarmed.add(path);
    api("/api/prewarm", {dir: path, w: 480}).catch(() => {});
  }
}, {rootMargin: "800px"});
function observeSections() {
  for (const s of document.querySelectorAll(".sec")) io.observe(s);
}

/* ---------- 筛选交互 ---------- */
function toggleFilt(dim, v) {
  const s = state.filt[dim];
  s.has(v) ? s.delete(v) : s.add(v);
  render();
}
function setDays(n) { state.filt.days = n; render(); }
function clearFilt() {

function openLB(i) {

function lbChips() {

  const t = day.tags[p.name] || {};

  for (const [dim, d] of Object.entries(DIMS))
    if (t[dim]) html.push(`<span class="chip" style="background:${d.color[t[dim]]}">${t[dim] === "best" ? "★ " : ""}${d.zh[t[dim]]}</span>`);
  $("lb-chips").innerHTML = html.join("");
}
function closeLB() { $("lb").classList.add("hidden"); state.lb = -1; }
function lbNav(d) { if (state.lb + d >= 0 && state.lb + d < state.flat.length) { state.lb += d; lbShow(); } }
/* 缩放引擎:.或点击=100%↔适应;触控板捏合连续变倍(锚定指针);缩放中双指滚动/拖拽/方向键平移 */
const ZMAX = 4;
const lbz = {on: false, scale: 1, panX: 0, panY: 0};
const lbStage = $("lb-stage"), lbImg = $("lb-img");
function lbFit() { const r = lbStage.getBoundingClientRect(); return Math.min(r.width / lbImg.naturalWidth, r.height / lbImg.naturalHeight, 1); }
function lbApply() {
  lbImg.style.transform = `translate(${lbz.panX}px, ${lbz.panY}px) scale(${lbz.scale})`;
  $("lb-zoom").textContent = Math.round(lbz.scale * 100) + "%";
}
function lbClamp() {
  const r = lbStage.getBoundingClientRect(), w = lbImg.naturalWidth * lbz.scale, h = lbImg.naturalHeight * lbz.scale;
  lbz.panX = w <= r.width ? (r.width - w) / 2 : Math.min(0, Math.max(r.width - w, lbz.panX));
  lbz.panY = h <= r.height ? (r.height - h) / 2 : Math.min(0, Math.max(r.height - h, lbz.panY));
}
function lbSetZoom(newS, cx, cy) {
  if (state.lb < 0 || !lbImg.naturalWidth) return;
  const cp = state.flat[state.lb];
  if (cp && /\.arw$/i.test(cp.p.name) && lbImg.dataset.full !== "1") {   // ARW:放大时换全尺寸
    lbImg.dataset.full = "1";
    lbImg.src = "/img?path=" + enc(cp.day.path + "/" + cp.p.name) + "&full=1";
    toast("RAW 全尺寸解码中…", 2000);
  }
  const fs = lbFit();
  newS = Math.min(ZMAX, Math.max(fs, newS));
  const r = lbStage.getBoundingClientRect();
  const px = cx == null ? r.width / 2 : cx - r.left;
  const py = cy == null ? r.height / 2 : cy - r.top;
  if (!lbz.on) {
    lbz.scale = fs;
    lbz.panX = (r.width - lbImg.naturalWidth * fs) / 2;
    lbz.panY = (r.height - lbImg.naturalHeight * fs) / 2;
  }
  const ix = (px - lbz.panX) / lbz.scale, iy = (py - lbz.panY) / lbz.scale;
  if (newS <= fs * 1.001) { exitLBZoom(); return; }
  lbz.on = true;
  lbz.scale = newS;
  lbz.panX = px - ix * newS;
  lbz.panY = py - iy * newS;
  lbClamp();
  lbImg.classList.add("zoomed");
  lbImg.style.transformOrigin = "0 0";
  lbApply();
  $("lb-zoom").style.display = "block";
}
function exitLBZoom() {
  lbz.on = false; lbz.scale = 1;
  lbImg.classList.remove("zoomed");
  lbImg.style.transform = "";
  $("lb-zoom").style.display = "none";
}
function toggleLBZoom(cx, cy) { lbz.on ? exitLBZoom() : lbSetZoom(1, cx, cy); }
function lbPan(dx, dy) { if (!lbz.on) return; lbz.panX += dx; lbz.panY += dy; lbClamp(); lbApply(); }
function isMouseWheel(e) {
  if (e.deltaMode !== 0) return true;
  const wd = e.wheelDeltaY;
  return !!wd && wd % 120 === 0 && e.deltaX === 0;
}
lbStage.addEventListener("wheel", e => {
  if (state.lb < 0) return;
  e.preventDefault();
  if (e.ctrlKey || e.metaKey) {              // 触控板捏合(Chrome 发 ctrlKey+wheel)
    const dy = Math.max(-50, Math.min(50, e.deltaY));
    lbSetZoom((lbz.on ? lbz.scale : lbFit()) * Math.exp(-dy * 0.012), e.clientX, e.clientY);
  } else if (isMouseWheel(e)) {              // 鼠标滚轮:每格 ±18%,锚定指针
    lbSetZoom((lbz.on ? lbz.scale : lbFit()) * (e.deltaY < 0 ? 1.18 : 1 / 1.18), e.clientX, e.clientY);
  } else if (lbz.on) lbPan(-e.deltaX, -e.deltaY);   // 触控板双指滚动平移
}, {passive: false});
let lbGBase = 0;                     // Safari 捏合
lbStage.addEventListener("gesturestart", e => { e.preventDefault(); lbGBase = lbz.on ? lbz.scale : lbFit(); });
lbStage.addEventListener("gesturechange", e => { e.preventDefault(); if (lbGBase) lbSetZoom(lbGBase * e.scale, e.clientX, e.clientY); });
lbStage.addEventListener("gestureend", e => e.preventDefault());
let lbDrag = null, lbDragMoved = false;
lbStage.addEventListener("pointerdown", e => { if (lbz.on) { lbDrag = {x: e.clientX, y: e.clientY}; lbDragMoved = false; } });
lbStage.addEventListener("pointermove", e => {
  if (!lbDrag) return;
  const dx = e.clientX - lbDrag.x, dy = e.clientY - lbDrag.y;
  if (Math.abs(dx) + Math.abs(dy) > 2) lbDragMoved = true;
  lbDrag = {x: e.clientX, y: e.clientY};
  lbPan(dx, dy);
});
addEventListener("pointerup", () => { lbDrag = null; });
lbImg.addEventListener("click", e => { if (lbDragMoved) { lbDragMoved = false; return; } toggleLBZoom(e.clientX, e.clientY); });

/* ---------- 灯箱里打 tag ---------- */
function lbSetDim(dim, val) {
  if (state.lb < 0) return;
  const {day, p} = state.flat[state.lb];
  const before = {...(day.tags[p.name] || {})};
  const after = {...before};
  if (after[dim] === val) delete after[dim]; else after[dim] = val;
  commitTag(day, p.name, before, after, true);
}
function commitTag(day, name, before, after, history) {
  const clean = {};
  for (const dim of Object.keys(DIMS)) if (after[dim]) clean[dim] = after[dim];
  if (history) { state.undoStack.push({day, name, before, after: clean}); state.redoStack.length = 0; }
  if (Object.keys(clean).length) day.tags[name] = clean; else delete day.tags[name];
  api("/api/tag", {dir: day.path, file: name, tags: clean})
    .catch(e => toast("⚠️ 保存失败:" + e.message, 2500));
  if (state.lb >= 0) lbChips();
  refreshItem(day, name);
}
function refreshItem(day, name) {
  const sec = document.querySelector(`.sec[data-day="${CSS.escape(day.path)}"]`);
  if (!sec) return;
  const it = sec.querySelector(`.it[data-name="${CSS.escape(name)}"]`);
  if (!it) return;
  const idx = state.flat.findIndex(x => x.day === day && x.p.name === name);
  const t = day.tags[name] || {};
  it.outerHTML = itemHTML(day, {name}, idx);
}
function lbUndo(redo) {
  const stack = redo ? state.redoStack : state.undoStack;
  const e = stack.pop();
  if (!e) { toast(redo ? "没有可重做的" : "没有可撤销的"); return; }
  (redo ? state.undoStack : state.redoStack).push(e);
  commitTag(e.day, e.name, {}, redo ? e.after : e.before, false);
  toast((redo ? "重做 ↪ " : "撤销 ↩ ") + e.name);
}

/* ---------- 键盘 ---------- */
addEventListener("keydown", e => {
  if (ss.on) {
    if (e.key === "Escape") {
      if (document.fullscreenElement) return;                    // 全屏时 Esc 交给浏览器退全屏 → fullscreenchange 解锁
      e.preventDefault();
      if (ss.locked) { ss.locked = false; showToolbar(); }       // 第一次:解锁,弹出工具栏
      else stopSlideshow();                                      // 再按:退出
    } else if (e.code === "Space") { e.preventDefault(); ssPlayPause(); }
    else if (e.code === "ArrowRight" || e.code === "KeyJ") { e.preventDefault(); go(1); }
    else if (e.code === "ArrowLeft" || e.code === "KeyK") { e.preventDefault(); go(-1); }
    return;
  }
  if (e.target instanceof HTMLInputElement) { if (e.key === "Escape") { e.target.blur(); closeModals(); } return; }
  if (modalOpen()) { if (e.key === "Escape") closeModals(); return; }
  const lbOn = state.lb >= 0;
  if (e.metaKey && e.code === "KeyZ") { e.preventDefault(); lbUndo(e.shiftKey); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (!lbOn) {
    if (e.code === "Slash" || e.code === "KeyH") toast("点开任意照片进入灯箱;灯箱内可用打标键位");
    return;
  }
  const tag = KEY2TAG[e.code];
  if (tag) { e.preventDefault(); lbSetDim(tag.dim, tag.val); return; }
  switch (e.code) {
    case "Space": case "KeyJ": e.preventDefault(); lbNav(1); break;
    case "KeyK": e.preventDefault(); lbNav(-1); break;
    case "ArrowRight": e.preventDefault(); lbz.on ? lbPan(-300, 0) : lbNav(1); break;
    case "ArrowLeft":  e.preventDefault(); lbz.on ? lbPan(300, 0)  : lbNav(-1); break;
    case "ArrowUp":    if (lbz.on) { e.preventDefault(); lbPan(0, 300); } break;
    case "ArrowDown":  if (lbz.on) { e.preventDefault(); lbPan(0, -300); } break;
    case "KeyU": e.preventDefault(); lbUndo(e.shiftKey); break;
    case "Period": e.preventDefault(); toggleLBZoom(); break;
    case "Escape": e.preventDefault(); lbz.on ? exitLBZoom() : closeLB(); break;
  }
});

/* ---------- 幻灯片(含竖屏拼图) ---------- */
const ss = { on: false, playing: false, animating: false, locked: true, slides: [], sPos: 0, timer: null,
             hintTimer: null, dwell: 8000, fade: 300, shuffle: "none", fill: false, set: [], aspects: new Map() };
const ssStage = () => $("ss-stage"), ssRow = () => $("ss-row");
function ssKey(it) { return it.day.path + "/" + it.p.name; }
function ssAspect(it) { return ss.aspects.get(ssKey(it)) || 1.5; }
function ssGap(w) { return Math.max(4, Math.round(w * 0.005)); }   // 照片间/两侧黑缝(比之前小不少)

function measureAspects(items) {         // 从缩略图量方向(含 EXIF 转正),限并发
  const todo = items.filter(it => !ss.aspects.has(ssKey(it)));
  if (!todo.length) return Promise.resolve();
  return new Promise(resolve => {
    let i = 0, done = 0, active = 0;
    const pump = () => {
      while (active < 8 && i < todo.length) {
        const it = todo[i++]; active++;
        const im = new Image();
        const fin = a => { ss.aspects.set(ssKey(it), a); active--; done++;
                           $("ss-load").textContent = "准备中… " + done + "/" + todo.length;
                           done >= todo.length ? resolve() : pump(); };
        im.onload = () => fin((im.naturalWidth / im.naturalHeight) || 1.5);
        im.onerror = () => fin(1.5);
        im.src = "/thumb?path=" + enc(ssKey(it)) + "&w=480";
      }
    };
    pump();
  });
}

function applyShuffle(items, mode) {
  const a = items.slice();
  const shuf = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } };
  if (mode === "big") { shuf(a); return a; }
  if (mode === "small") {                // 天序不变,天内打乱(items 已按天连续)
    const out = []; let i = 0;
    while (i < a.length) { let j = i; while (j < a.length && a[j].day === a[i].day) j++;
      const seg = a.slice(i, j); shuf(seg); out.push(...seg); i = j; }
    return out;
  }
  return a;
}

function packAll(queue) {                 // 贪心装排:每张贴满屏高,凑满一横排;竖屏抽后面竖屏来凑
  const slides = [], q = queue.slice();
  const r = ssStage().getBoundingClientRect();
  const H = r.height, GAP = ssGap(r.width);
  const avail = r.width - 2 * GAP;        // 两侧至少留 GAP 的空隙
  const wOf = it => H * ssAspect(it);
  while (q.length) {
    const slide = [q.shift()];
    let used = wOf(slide[0]);
    while (slide.length < 6) {
      const rem = avail - used - GAP;      // 再放一张,先扣一条缝
      if (rem <= 1) break;
      let idx = -1;
      for (let k = 0; k < Math.min(14, q.length); k++) if (wOf(q[k]) <= rem) { idx = k; break; }
      if (idx === -1) break;
      slide.push(q.splice(idx, 1)[0]);
      used += GAP + wOf(slide[slide.length - 1]);
    }
    slides.push(slide);
  }
  return slides;
}

function renderSlide(items) {
  const r = ssStage().getBoundingClientRect();
  const H = r.height, GAP = ssGap(r.width);
  const totalAspect = items.reduce((s, it) => s + ssAspect(it), 0) || 1;
  const row = ssRow();
  row.style.gap = GAP + "px";
  row.classList.toggle("fill", ss.fill);
  if (ss.fill) {                           // 铺满:每张按长宽比分到一份屏宽,cover 裁剪填满,仅留缝隙
    const availW = r.width - GAP * (items.length - 1);
    row.innerHTML = items.map(it =>
      `<img src="/img?path=${enc(ssKey(it))}" style="width:${Math.round(ssAspect(it) / totalAspect * availW)}px;height:${Math.round(H)}px">`).join("");
  } else {                                 // 适应:贴满屏高、留侧边;单张 pano/超宽则整排缩放 letterbox
    const availW = r.width - 2 * GAP;
    let imgH = H;
    const rowW = imgH * totalAspect + GAP * (items.length - 1);
    if (rowW > availW) imgH = (availW - GAP * (items.length - 1)) / totalAspect;
    row.innerHTML = items.map(it =>
      `<img src="/img?path=${enc(ssKey(it))}" style="height:${Math.round(imgH)}px;width:${Math.round(imgH * ssAspect(it))}px">`).join("");
  }
  return slideImagesReady(1500);
}
function slideImagesReady(ms) {             // 等这屏图片解码就位,淡入前调用,避免"淡入到空屏再啪一下冒出来"
  const imgs = [...ssRow().querySelectorAll("img")];
  const ps = imgs.map(im => (im.complete && im.naturalWidth) ? Promise.resolve()
    : new Promise(res => { im.onload = im.onerror = res; }));
  return Promise.race([Promise.all(ps), new Promise(res => setTimeout(res, ms))]);
}

function preloadSlide(pos) {
  const s = ss.slides[(pos % ss.slides.length + ss.slides.length) % ss.slides.length]; if (!s) return;
  for (const it of s) { const im = new Image(); im.src = "/img?path=" + enc(ssKey(it)); }
}

async function startSlideshow() {
  const set = currentSet();
  if (!set.length) { toast("没有可播放的照片"); return; }
  ss.on = true; ss.set = set;
  $("ss").classList.remove("hidden");
  $("ss-load").textContent = "准备中…"; $("ss-load").classList.remove("hidden");
  const el = $("ss");
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  await new Promise(r => setTimeout(r, 80));    // 等全屏尺寸稳定
  await measureAspects(set);
  rebuildSlides();
  $("ss-load").classList.add("hidden");
  ss.playing = true; $("ss-play").textContent = "⏸";
  ssStage().style.opacity = 0;
  await showSlide(0);
  ssFade(1);
  preloadSlide(1); scheduleNext();
  ss.locked = true; hideToolbar(); flashHint();
}
function rebuildSlides() { ss.slides = packAll(applyShuffle(ss.set, ss.shuffle)); ss.sPos = 0; }
function showSlide(pos) {                   // 只布局 + 等图片就位(不碰透明度),返回 Promise
  if (!ss.slides.length) return Promise.resolve();
  ss.sPos = (pos % ss.slides.length + ss.slides.length) % ss.slides.length;
  $("ss-pos").textContent = (ss.sPos + 1) + "/" + ss.slides.length + " 屏 · " + ss.set.length + " 张";
  return renderSlide(ss.slides[ss.sPos]);
}
function ssFade(target) {                             // 用 WAAPI 显式补间透明度(不依赖 CSS 过渡的重触发时机)
  const st = ssStage();
  const from = parseFloat(getComputedStyle(st).opacity) || 0;
  st.style.opacity = target;                          // 定稿值(动画结束后落到这里)
  return st.animate([{opacity: from}, {opacity: target}], {duration: ss.fade, easing: "ease"});
}
function go(dir) {
  if (ss.animating || !ss.on) return;
  ss.animating = true; clearTimeout(ss.timer);
  ssFade(0).onfinish = async () => {                  // 淡出到全黑
    if (!ss.on) { ss.animating = false; return; }
    await showSlide(ss.sPos + dir);                   // 全黑时布局 + 等图解码就位
    ssFade(1);                                        // 图已就位再淡入
    preloadSlide(ss.sPos + 1);
    ss.animating = false;
    if (ss.playing) scheduleNext();
  };
}
function scheduleNext() { clearTimeout(ss.timer); if (ss.playing && ss.on) ss.timer = setTimeout(() => go(1), ss.dwell); }
function ssPlayPause() {
  ss.playing = !ss.playing; $("ss-play").textContent = ss.playing ? "⏸" : "▶";
  ss.playing ? scheduleNext() : clearTimeout(ss.timer);
}
function stopSlideshow() {
  ss.on = false; ss.playing = false; ss.locked = true; clearTimeout(ss.timer); clearTimeout(ss.hintTimer);
  $("ss").classList.add("hidden"); $("ss-ctrl").classList.add("hidden"); $("ss-hint").classList.add("hidden"); ssRow().innerHTML = "";
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}
function showToolbar() { $("ss-ctrl").classList.remove("hidden"); $("ss-hint").classList.add("hidden"); }
function hideToolbar() { $("ss-ctrl").classList.add("hidden"); }
function flashHint() { const h = $("ss-hint"); h.classList.remove("hidden"); clearTimeout(ss.hintTimer); ss.hintTimer = setTimeout(() => h.classList.add("hidden"), 3200); }
$("ss-prev").onclick = () => go(-1);
$("ss-next").onclick = () => go(1);
$("ss-play").onclick = ssPlayPause;
$("ss-exit").onclick = stopSlideshow;
$("ss-lock").onclick = () => { ss.locked = true; hideToolbar(); const el = $("ss"); if (el.requestFullscreen && !document.fullscreenElement) el.requestFullscreen().catch(() => {}); };
for (const b of document.querySelectorAll("#ss-shuf button")) b.onclick = () => {
  ss.shuffle = b.dataset.s;
  for (const x of document.querySelectorAll("#ss-shuf button")) x.classList.toggle("on", x === b);
  rebuildSlides(); showSlide(0); preloadSlide(1); scheduleNext();
};
for (const b of document.querySelectorAll("#ss-speed button")) b.onclick = () => {
  ss.dwell = +b.dataset.d;
  for (const x of document.querySelectorAll("#ss-speed button")) x.classList.toggle("on", x === b);
  scheduleNext();
};
for (const b of document.querySelectorAll("#ss-fit button")) b.onclick = () => {
  ss.fill = b.dataset.f === "1";
  for (const x of document.querySelectorAll("#ss-fit button")) x.classList.toggle("on", x === b);
  if (ss.on) renderSlide(ss.slides[ss.sPos]);
};
document.addEventListener("fullscreenchange", () => {   // 全屏下 Esc 退出全屏 = 第一次解锁,显示工具栏(不退出幻灯片)
  if (!document.fullscreenElement && ss.on && ss.locked) { ss.locked = false; showToolbar(); }
});
addEventListener("resize", () => { if (ss.on && ss.slides[ss.sPos]) renderSlide(ss.slides[ss.sPos]); });

/* ---------- 页面切换器 ---------- */
function wireNav() {   // 「打标·画廊·工具」切换器带上当前 root(各页 localStorage key 不同,需显式传)
  const root = state.root || localStorage.getItem("ptg:root") || new URLSearchParams(location.search).get("root");
  if (!root) return;
  for (const a of document.querySelectorAll("#ptnav a:not(.cur)"))
    a.href = a.getAttribute("data-base") + "?root=" + enc(root);
}

/* ---------- 启动 ---------- */
(async function init() {
  wireNav();
  try { const c = await api("/api/config"); state.home = c.home || ""; if (!localStorage.getItem("ptg:root")) localStorage.setItem("ptg:root", c.root || ""); } catch (e) {}
  const params = new URLSearchParams(location.search);
  const root = params.get("root") || localStorage.getItem("ptg:root");
  if (root) { toast("加载中…", 60000); await setRoot(root); toast("完成 ✓"); }
  else openRootModal();
  if (params.get("ss") === "1" && state.flat.length) {   // 深链直接进幻灯片(&fill=1 铺满,&fade=ms 调淡入淡出)
    ss.fill = params.get("fill") === "1";
    const f = parseInt(params.get("fade")); if (!isNaN(f)) ss.fade = Math.max(0, f);
    startSlideshow();
  }
})();
</script>
</body>
